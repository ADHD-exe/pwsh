# =============================================================================
#  fzf.conf  -  global fzf options  ($env:FZF_DEFAULT_OPTS_FILE)
# =============================================================================
#  Loaded automatically by PSFzf.config.ps1.
#
#  NOTE ON COMMENTS: fzf only allows "#" comments in this file from v0.55.0 on.
#  PSFzf.config.ps1 checks your fzf version -- on anything older it strips these
#  comments itself and feeds the options in through $env:FZF_DEFAULT_OPTS, so
#  the file stays readable either way.
#
#  NOTE ON COLORS: the palette below is the oh-my-rabbit.omp.json palette, written
#  as "#rrggbb" hex (needs a truecolor terminal - Windows Terminal is). Keep every
#  hex value directly after a ":" (fg:#00ffff) so the old-fzf comment stripper in
#  PSFzf.config.ps1, which only removes a "#" that follows whitespace, leaves it alone.
# =============================================================================


# -----------------------------------------------------------------------------
# Layout -- big, bordered, top-down, with the match counter tucked to the right
# -----------------------------------------------------------------------------
--height=85%
--layout=reverse
--border=rounded
--border-label=" fzf"
--border-label-pos=3
--margin=0,1
--info=inline-right
--separator=─
--scrollbar=▌
--ellipsis=…
--tabstop=4
--cycle
--multi
--highlight-line

# Glyphs below need a Nerd Font (you already run p10k, so you have one).
# Swap to plain ASCII if a terminal ever renders them as boxes:
#   --prompt=>    --pointer=>    --marker=+
--prompt=
--pointer=▶
--marker=✚


# -----------------------------------------------------------------------------
# Matching -- shortest match first, then earliest, then original order.
# This is what makes "cfg" find "app.cfg" before "configuration_manager.cs".
# -----------------------------------------------------------------------------
--tiebreak=length,begin,index


# -----------------------------------------------------------------------------
# Default source: the whole C: drive.
#
# fzf's built-in walker is used whenever nothing is piped in and
# $FZF_DEFAULT_COMMAND is unset -- so a bare `fzf` at any prompt searches C:\.
# When something IS piped in (all the ff* functions, PSFzf's Ctrl+T), the walker
# is ignored and these three lines cost nothing.
#
# --walker-skip only matches single path components, not nested paths.
# -----------------------------------------------------------------------------
--walker=file,follow,hidden
--walker-root=C:\
--walker-skip=".git,node_modules,$Recycle.Bin,System Volume Information,WinSxS,servicing,WindowsApps,Package Cache,DriverStore,Temp,AppData"


# -----------------------------------------------------------------------------
# Preview -- fzf-preview.cmd is a plain batch file (no PowerShell startup cost).
# It uses bat for files and eza/dir for folders, falling back gracefully.
# ~3 keeps the first 3 lines pinned when the preview scrolls.
# -----------------------------------------------------------------------------
--preview="fzf-preview.cmd {}"
--preview-window=right,55%,border-left,wrap,~3


# -----------------------------------------------------------------------------
# Keys inside the fzf window
# -----------------------------------------------------------------------------
# Preview
--bind=ctrl-/:toggle-preview
--bind=alt-p:toggle-preview
--bind="alt-w:change-preview-window(down,60%,border-top|hidden|right,55%,border-left)"
--bind=alt-up:preview-page-up
--bind=alt-down:preview-page-down

# Selection
--bind=ctrl-a:select-all
--bind=ctrl-x:deselect-all
--bind=ctrl-s:toggle-sort
--bind=ctrl-u:clear-query
--bind=home:first
--bind=end:last

# Act on the highlighted item without leaving fzf
--bind="ctrl-y:execute-silent(fzf-action.cmd copy {})"
--bind="ctrl-o:execute-silent(fzf-action.cmd open {})"
--bind="ctrl-e:execute-silent(fzf-action.cmd reveal {})"

--header="ctrl-y copy · ctrl-o open · ctrl-e reveal · ctrl-/ preview · tab mark"


# -----------------------------------------------------------------------------
# Colors -- the oh-my-rabbit.omp.json palette (same hex values as the prompt)
#   cyan   #00ffff  session segment      purple #ce39f9 / #120020  path + time segments
#   teal   #27fcd1  duration / weather   pink   #ff42a0            sysinfo segment
#   green  #33ff33  os / battery         lime   #f3ff13            git segment
#   cream  #ffff80  shell segment        red    #ff0000            errors
# bg stays -1 (your terminal's #1C1B26) so fzf blends into the window.
# -----------------------------------------------------------------------------
--color=fg:#00ffff,fg+:#ffff80,bg:-1,bg+:#120020
--color=hl:#ff42a0,hl+:#ff42a0
--color=info:#27fcd1,prompt:#33ff33,pointer:#ce39f9
--color=marker:#f3ff13,spinner:#27fcd1,header:#ce39f9
--color=border:#ce39f9,label:#ff42a0,query:#ffff80
--color=separator:#ce39f9,scrollbar:#ce39f9,gutter:-1
--color=preview-bg:-1,preview-border:#ce39f9
